# Fly.io app configuration for the BUMP RUN realtime server.
# Builds from the repo-root Dockerfile. See docs/deployment.md.
#
# NOTE: app name is "bump-run" (not "bump-run-server") because Fly's
# "Launch an App from GitHub" flow names the app after the repo and that
# can't be changed after the fact without deleting and recreating the app.
app = "bump-run"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PUBLIC_BASE_URL = "https://bump-run.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
