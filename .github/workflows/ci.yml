name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint, typecheck, test, build (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack / pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build server
        run: pnpm run build:server

      - name: Build controller
        run: pnpm run build:controller

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK pre-installed on disk
      # (commonly /usr/local/lib/android/sdk) but DON'T export ANDROID_HOME
      # in this job's environment, and installing packages via the
      # android-actions/setup-android marketplace action fails outright
      # (it tries to install a long-deprecated "tools" package). Locate the
      # SDK and sdkmanager directly, then export ANDROID_HOME/ANDROID_SDK_ROOT
      # for the Gradle build step below, which needs them to find the SDK.
      - name: Install required SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK root: $SDK_ROOT"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort -r | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not locate sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/tv/gradlew

      - name: Build debug APK
        working-directory: apps/tv
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bump-run-debug-apk
          path: apps/tv/app/build/outputs/apk/debug/app-debug.apk
