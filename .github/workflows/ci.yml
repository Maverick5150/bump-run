name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint, typecheck, test, build (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack / pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build server
        run: pnpm run build:server

      - name: Build controller
        run: pnpm run build:controller

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Neither a pre-installed SDK nor the android-actions/setup-android
      # marketplace action proved reliable on this runner image (the former
      # isn't consistently exported as ANDROID_HOME, the latter fails trying
      # to install a long-deprecated "tools" package). Download a known-good
      # command-line-tools build directly -- this is exactly what
      # scripts/install-firetv.ps1's local setup does too, just for Linux.
      - name: Install Android SDK command-line tools
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/tv/gradlew

      - name: Build debug APK
        working-directory: apps/tv
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bump-run-debug-apk
          path: apps/tv/app/build/outputs/apk/debug/app-debug.apk
