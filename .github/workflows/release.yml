name: Release

# Tag a commit like "v0.1.0" to build a release artifact, or run manually
# from the Actions tab (Run workflow) without needing a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # See ci.yml for why this installs packages directly instead of using
      # the android-actions/setup-android marketplace action.
      - name: Install required SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK root: $SDK_ROOT"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort -r | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not locate sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/tv/gradlew

      # Signed releases need these repository secrets (see docs/deployment.md):
      #   ANDROID_KEYSTORE_BASE64   -- base64-encoded .jks keystore file
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # Without them, this still produces an unsigned/debug-signed build so the
      # pipeline keeps working, but it is NOT suitable for public distribution.
      - name: Decode signing keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/tv/release.jks
          cat > apps/tv/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: apps/tv
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bump-run-release-apk-${{ github.ref_name }}
          path: apps/tv/app/build/outputs/apk/release/app-release*.apk
