name: Release

# Tag a commit like "v0.1.0" to build a release artifact, or run manually
# from the Actions tab (Run workflow) without needing a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # See ci.yml for why this installs packages directly instead of using
      # the android-actions/setup-android marketplace action.
      - name: Install Android SDK command-line tools
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/tv/gradlew

      # Signed releases need these repository secrets (see docs/deployment.md):
      #   ANDROID_KEYSTORE_BASE64   -- base64-encoded .jks keystore file
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # Without them, this still produces an unsigned/debug-signed build so the
      # pipeline keeps working, but it is NOT suitable for public distribution.
      - name: Decode signing keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/tv/release.jks
          cat > apps/tv/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: apps/tv
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bump-run-release-apk-${{ github.ref_name }}
          path: apps/tv/app/build/outputs/apk/release/app-release*.apk
